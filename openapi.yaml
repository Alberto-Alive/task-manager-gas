openapi: 3.1.0
info:
  title: AI-First Task Manager Proxy API
  version: 1.0.1
servers:
  - url: YOUR_WORKER_URL
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Envelope:
      type: object
      additionalProperties: false
      required:
        - ok
        - request_id
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        data:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/ApiError"
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        notes:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: string
          format: date-time
        scheduled_for:
          type: string
          format: date-time
        snoozed_until:
          type: string
          format: date-time
        contexts:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tags:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        status:
          type: string
          enum:
            - ACTIVE
            - COMPLETED
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/list:
    get:
      operationId: listTasks
      summary: List tasks (small response)
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - COMPLETED
        - in: query
          name: include_completed
          required: false
          schema:
            type: boolean
            default: false
          description: Set true to include completed tasks (required when status=COMPLETED).
        - in: query
          name: include_snoozed
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/get:
    get:
      operationId: getTask
      summary: Get a task by id
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: include_notes
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/create:
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
              properties:
                idempotency_key:
                  type: string
                title:
                  type: string
                notes:
                  type: string
                priority:
                  type: integer
                  minimum: 1
                  maximum: 5
                due_at:
                  type: string
                  format: date-time
                scheduled_for:
                  type: string
                  format: date-time
                snoozed_until:
                  type: string
                  format: date-time
                contexts:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/update:
    post:
      operationId: updateTask
      summary: Update a task by id with patch fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - patch
              properties:
                idempotency_key:
                  type: string
                id:
                  type: string
                patch:
                  $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/complete:
    post:
      operationId: completeTask
      summary: Mark task complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
              properties:
                idempotency_key:
                  type: string
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/snooze:
    post:
      operationId: snoozeTask
      summary: Snooze a task until a datetime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - until
              properties:
                idempotency_key:
                  type: string
                id:
                  type: string
                until:
                  type: string
                  format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /tasks/next:
    post:
      operationId: nextTask
      summary: Get best next task right now
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                now:
                  type: string
                  format: date-time
                timezone:
                  type: string
                  description: IANA timezone
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
